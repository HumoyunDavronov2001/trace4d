<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="TRACE4D — yer osti muhandislik tarmoqlarining raqamli egizagi">
  <defs>
    <linearGradient id="fon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0f1724"/>
    </linearGradient>
    <linearGradient id="tuproq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2c1f"/>
      <stop offset="1" stop-color="#1c140d"/>
    </linearGradient>
    <linearGradient id="nur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="tor" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141c2a" stroke-width="1"/>
    </pattern>
    <pattern id="nuqta" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#67e8f9"/>
      <circle cx="6.5" cy="6" r="1" fill="#a5f3fc"/>
    </pattern>
    <clipPath id="xandaq"><path d="M720 170 L1220 170 L1220 330 L720 330 Z"/></clipPath>
    <style>
      .sarlavha{font:800 56px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#f8fafc;letter-spacing:2px}
      .izoh{font:500 21px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#94a3b8}
      .teg{font:600 15px 'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;fill:#cbd5e1}
      .kich{font:700 12px 'DejaVu Sans Mono',Consolas,monospace}
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#fon)"/>
  <rect width="1280" height="360" fill="url(#tor)" opacity=".6"/>

  <g transform="translate(64 0)">
    <rect x="0" y="70" width="56" height="56" rx="14" fill="#22d3ee"/>
    <path d="M12 104 H44 M12 92 H44" stroke="#06202a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="104" r="5" fill="#06202a"/><circle cx="36" cy="92" r="5" fill="#06202a"/>
    <text class="sarlavha" x="0" y="192">TRACE<tspan fill="#22d3ee">4D</tspan></text>
    <text class="izoh" x="0" y="232">Yer osti tarmoqlari: LiDAR skan · RTK 2 sm · quvur aniqlash</text>
    <g transform="translate(0 270)">
      <rect width="72" height="30" rx="15" fill="#162033"/><text class="teg" x="36" y="20" text-anchor="middle">Swift</text>
      <rect x="82" width="86" height="30" rx="15" fill="#162033"/><text class="teg" x="125" y="20" text-anchor="middle">Python</text>
      <rect x="178" width="88" height="30" rx="15" fill="#162033"/><text class="teg" x="222" y="20" text-anchor="middle">ARKit</text>
      <rect x="276" width="104" height="30" rx="15" fill="#162033"/><text class="teg" x="328" y="20" text-anchor="middle">MapLibre</text>
      <rect x="390" width="118" height="30" rx="15" fill="#162033"/><text class="teg" x="449" y="20" text-anchor="middle">IFC · DXF</text>
    </g>
  </g>

  <!-- Ko'cha kesimi: asfalt, tuproq, quvurlar; skaner nuri va nuqtalar buluti (SMIL) -->
  <g>
    <!-- RTK sun'iy yo'ldosh -->
    <g transform="translate(1180 46)">
      <rect x="-10" y="-6" width="20" height="12" rx="2" fill="#cbd5e1"/>
      <rect x="-30" y="-4" width="16" height="8" fill="#38bdf8"/><rect x="14" y="-4" width="16" height="8" fill="#38bdf8"/>
      <circle r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
        <animate attributeName="r" values="12;44" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text class="kich" x="1060" y="112" fill="#38bdf8">RTK FIX · ±2 sm</text>

    <!-- yer sathi -->
    <rect x="700" y="150" width="540" height="20" fill="#2b2f36"/>
    <path d="M700 160 H1240" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="20 14"/>
    <rect x="720" y="170" width="500" height="160" fill="url(#tuproq)"/>

    <!-- quvurlar -->
    <g>
      <rect x="720" y="214" width="500" height="18" rx="9" fill="#2563eb"/>
      <rect x="720" y="254" width="500" height="12" rx="6" fill="#eab308"/>
      <rect x="720" y="292" width="500" height="8" rx="4" fill="#dc2626"/>
    </g>

    <!-- nuqtalar buluti chapdan o'ngga to'ladi -->
    <g clip-path="url(#xandaq)">
      <rect x="720" y="170" width="0" height="160" fill="url(#nuqta)" opacity=".55">
        <animate attributeName="width" values="0;500;500;0" keyTimes="0;.7;.95;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- telefon skaneri va nur -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;500 0;500 0;0 0" keyTimes="0;.7;.95;1" dur="7s" repeatCount="indefinite"/>
      <path d="M720 120 L690 330 L750 330 Z" fill="url(#nur)"/>
      <rect x="708" y="96" width="24" height="40" rx="5" fill="#e2e8f0"/>
      <rect x="712" y="101" width="16" height="28" rx="2" fill="#0f172a"/>
      <circle cx="720" cy="132" r="2" fill="#22d3ee"/>
    </g>

    <!-- aniqlangan quvur o'qi -->
    <path d="M720 223 H1220" stroke="#a5f3fc" stroke-width="2" stroke-dasharray="500" stroke-dashoffset="500">
      <animate attributeName="stroke-dashoffset" values="500;500;0;0;500" keyTimes="0;.1;.75;.95;1" dur="7s" repeatCount="indefinite"/>
    </path>
    <text class="kich" x="1216" y="206" text-anchor="end" fill="#a5f3fc" opacity="0">Ø110 · chuqurlik 1,42 m
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.72;.78;.95;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
